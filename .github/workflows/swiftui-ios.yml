name: SwiftUI iOS

on:
  push:
    branches: [dev]
    paths:
      - "client/swiftui/**"
      - "client/3rd/amneziawg-apple/**"
      - ".github/workflows/swiftui-ios.yml"
  pull_request:
    branches: [dev]
    paths:
      - "client/swiftui/**"
      - "client/3rd/amneziawg-apple/**"
      - ".github/workflows/swiftui-ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out amneziawg-apple submodule
        run: git submodule update --init client/3rd/amneziawg-apple

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_26.0.app 2>/dev/null \
            || echo "using default Xcode"
          xcodebuild -version

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download core library artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/core-lib.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::no successful core-lib run found; run the 'Build core library' workflow first"
            exit 1
          fi
          echo "core-lib run: $RUN_ID"
          gh run download "$RUN_ID" --name AmneziaCore-iphoneos --dir core-lib
          ls -lh core-lib/ core-lib/headers/

      - name: Archive (unsigned)
        run: |
          xcodebuild -project client/swiftui/AmneziaVPN-SwiftUI.xcodeproj \
            -scheme AmneziaVPN-SwiftUI \
            -configuration Release \
            -xcconfig core-lib/CoreLibLink.xcconfig \
            -destination 'generic/platform=iOS' \
            -archivePath build/AmneziaVPN.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/AmneziaVPN.xcarchive/Products/Applications/AmneziaVPN.app Payload/
          zip -qr AmneziaVPN-unsigned.ipa Payload
          ls -lh AmneziaVPN-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-unsigned
          path: AmneziaVPN-unsigned.ipa
          if-no-files-found: error
