name: SwiftUI iOS

on:
  push:
    branches: [dev]
    paths:
      - "client/swiftui/**"
      - "client/3rd/amneziawg-apple/**"
      - ".github/workflows/swiftui-ios.yml"
  pull_request:
    branches: [dev]
    paths:
      - "client/swiftui/**"
      - "client/3rd/amneziawg-apple/**"
      - ".github/workflows/swiftui-ios.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out amneziawg-apple submodule
        run: git submodule update --init client/3rd/amneziawg-apple

      - name: Setup Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Verify iOS SDK present
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: client/3rd/amneziawg-apple/Sources/WireGuardKitGo/go.sum

      - name: Archive (unsigned)
        run: |
          xcodebuild -project client/swiftui/AmneziaVPN-SwiftUI.xcodeproj \
            -scheme AmneziaVPN-SwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AmneziaVPN.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/AmneziaVPN.xcarchive/Products/Applications/AmneziaVPN.app Payload/
          zip -qr AmneziaVPN-unsigned.ipa Payload
          ls -lh AmneziaVPN-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-unsigned
          path: AmneziaVPN-unsigned.ipa
          if-no-files-found: error
