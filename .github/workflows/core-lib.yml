name: Build core library

on:
  push:
    branches: [dev]
    paths:
      - "client/core/**"
      - "client/ui/**"
      - "client/platforms/ios/**"
      - "client/swiftui/Bridge/**"
      - "client/CMakeLists.txt"
      - "client/cmake/**"
      - "cmake/**"
      - "conanfile.py"
      - "recipes/**"
      - ".github/workflows/core-lib.yml"
  pull_request:
    branches: [dev]
    paths:
      - "client/core/**"
      - "client/ui/**"
      - "client/platforms/ios/**"
      - "client/swiftui/Bridge/**"
      - "client/CMakeLists.txt"
      - "client/cmake/**"
      - "cmake/**"
      - "conanfile.py"
      - "recipes/**"
      - ".github/workflows/core-lib.yml"
  workflow_dispatch:

env:
  QT_VERSION: 6.10.1
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  PROD_AGW_PUBLIC_KEY_B64: ${{ secrets.PROD_AGW_PUBLIC_KEY_B64 }}
  PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
  FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
  SANDBOX_AGW_PUBLIC_KEY_B64: ${{ secrets.SANDBOX_AGW_PUBLIC_KEY_B64 }}
  SANDBOX_AGW_ENDPOINT: ${{ secrets.SANDBOX_AGW_ENDPOINT }}
  SANDBOX_S3_ENDPOINT: ${{ secrets.SANDBOX_S3_ENDPOINT }}
  FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
  PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

jobs:
  build-core-lib:
    name: Build libAmneziaCore.a (iphoneos)
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 10

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Install desktop Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
          arch: 'clang_64'
          dir: ${{ runner.temp }}
          set-env: 'true'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Install iOS Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'ios'
          modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
          dir: ${{ runner.temp }}
          setup-python: 'true'
          set-env: 'true'
          extra: '--external 7z --base ${{ env.QT_MIRROR }}'

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install deps
        run: pip install "conan==2.28.0" jsonschema jinja2

      - name: Configure core library
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          cmake -S . -B build-core -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/ios/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/macos" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMNEZIA_BUILD_CORE_LIB=ON \
            -DCLIENT_SWIFT_MODULE_NAME=AmneziaCore \
            -DCLIENT_SWIFT_OBJC_HEADER_NAME=AmneziaCore-Swift.h

      - name: Build libAmneziaCore.a
        run: cmake --build build-core --config Release --target AmneziaCore --parallel

      - name: Collect artifact
        run: |
          mkdir -p core-lib-artifact/headers
          cp build-core/client/Release-iphoneos/libAmneziaCore.a core-lib-artifact/
          cp client/swiftui/Bridge/AmneziaCoreBridge.h core-lib-artifact/headers/
          ls -lh core-lib-artifact/ core-lib-artifact/headers/

      - name: Upload core library artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaCore-iphoneos
          path: core-lib-artifact/
          if-no-files-found: error
          retention-days: 90
